[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-hoops-dev"
version = "0.2.0"
description = "Dev tools and test helpers for the open-hoops monorepo"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0", "pytest-factoryboy>=2.7", "ruff==0.16.4", "mypy>=1.10"]

[tool.uv.workspace]
members = ["backend/dashboard-api", "backend/open_hoops", "backend/worker", "backend/testhelpers"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["backend/dashboard-api/alembic", "**/*.md"]

[tool.ruff.lint.per-file-ignores]
"backend/dashboard-api/app/routers/**" = ["B008"]
"backend/dashboard-api/app/routers/**/router.py" = ["E402", "F401"]
"backend/open_hoops/open_hoops/service/**" = ["TC004", "F821"]
"backend/open_hoops/open_hoops/identity/**" = ["TC004"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["backend/open_hoops/open_hoops/tests"]
