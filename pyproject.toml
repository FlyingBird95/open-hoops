[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open_hoops"
version = "0.1.0"
description = "Extract basketball stats from video using YOLO"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "ultralytics>=8.0",
    "easyocr>=1.7",
    "opencv-python>=4.9",
    "pydantic>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["backend/alembic"]

[tool.ruff.lint.per-file-ignores]
"backend/app/routers/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["open_hoops/tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["open_hoops*"]
