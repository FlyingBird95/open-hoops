repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: tsc
        name: TypeScript check
        entry: >-
          bash -c
          'if [ -d frontend/dashboard/node_modules ];
          then cd frontend/dashboard && npx tsc --noEmit;
          else echo "Skipping tsc - run npm ci in frontend/dashboard first"; fi'
        language: system
        pass_filenames: false
        files: ^frontend/dashboard/.*\.(ts|tsx)$
