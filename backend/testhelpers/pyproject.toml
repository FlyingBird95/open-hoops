[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-hoops-testhelpers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "open-hoops",
    "pytest>=8.0",
    "pytest-factoryboy>=2.7",
    "factory-boy>=3.3",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]

[tool.uv.sources]
open-hoops = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["testhelpers"]
